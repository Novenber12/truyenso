<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./main.js" defer></script>
  <script src="https://kit.fontawesome.com/6d2716b1d1.js" crossorigin="anonymous"></script>
</head>
<body>
  <!-- Previous button -->
   <button id="prev-btn">
    <i class="fa fa-arrow-circle-left"></i>
   </button>

  <!-- Book -->
  <div id="book" class="book">
    <!-- Trang 1 -->
    <div id="p1" class="paper">
      <!-- Bìa trước -->
      <div class="front">
        <div id="f1" class="front-content">
          <h1>Front 1</h1>
        </div>
      </div>

      <!-- Bìa sau -->
      <div class="back">
        <div id="b1" class="back-content">
          <h1>back 1</h1>
        </div>
      </div>
    </div>
    
    <!-- Trang 2 -->
    <div id="p2" class="paper">
      <!-- Bìa trước -->
      <div class="front">
        <div id="f2" class="front-content">
          <h1>Front 2</h1>
        </div>
      </div>

      <!-- Bìa sau -->
      <div class="back">
        <div id="b2" class="back-content">
          <h1>back 2</h1>
        </div>
      </div>
    </div>
    <!-- Trang 3 -->
    <div id="p3" class="paper">
      <!-- Bìa trước -->
      <div class="front">
        <div id="f3" class="front-content">
          <h1>Front 3</h1>
        </div>
      </div>

      <!-- Bìa sau -->
      <div class="back">
        <div id="b3" class="back-content">
          <h1>back 3</h1>
        </div>
      </div>
    </div>

  </div>

  <!-- Next botton -->
  <button id="next-btn">
    <i class="fa fa-arrow-circle-right"></i>
   </button>
</body>
</html>
